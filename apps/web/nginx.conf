# Il valore di Cache-Control si decide qui, in base al percorso, invece che con
# un add_header dentro ogni location. Il motivo e' una regola di nginx che coglie
# molti di sorpresa: un add_header in una location AZZERA tutti gli add_header
# ereditati dal blocco server, quindi le intestazioni di sicurezza sparirebbero
# proprio sui file piu' serviti.
map $uri $tempra_cache_control {
    default                      "public, max-age=300";
    ~^/assets/                   "public, max-age=31536000, immutable";
    ~^/fonts/                    "public, max-age=31536000, immutable";
    ~^/img/ex/                   "public, max-age=15552000";
    ~^/sw\.js$                   "no-cache, must-revalidate";
    ~^/manifest\.webmanifest$    "no-cache";
    ~^/index\.html$              "no-cache, must-revalidate";
    ~^/$                         "no-cache, must-revalidate";
}

server {
    # Solo IPv4: nei container su rete Docker basta, e un listen su IPv6
    # impedisce l'avvio di nginx dove lo stack IPv6 e' disabilitato nel kernel.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressione: il catalogo esercizi passa da 547 KB a circa 55 KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/manifest+json
        image/svg+xml font/woff2;

    # Intestazioni valide per ogni risposta, comprese quelle di errore.
    add_header Cache-Control $tempra_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Il service worker deve poter controllare tutta la radice del sito.
    location = /sw.js {
        add_header Cache-Control $tempra_cache_control always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ { try_files $uri =404; }
    location /fonts/  { try_files $uri =404; }
    location /img/ex/ { try_files $uri =404; }

    # Il routing e' lato client: qualunque percorso sconosciuto serve il guscio.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
