# Stack completo di Tempra.
#
# La PWA funziona anche da sola: il database e l'API servono solo per la
# sincronizzazione fra dispositivi. Chi vuole una installazione minimale puo'
# avviare il solo servizio "web".
#
# Avvio locale:   docker compose up --build
# Solo la PWA:    docker compose up --build web

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve una password per il database}
      POSTGRES_DB: ${POSTGRES_DB:-tempra}
      # Le date sono sempre in UTC: la conversione al fuso locale e' compito del client.
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tempra} -d ${POSTGRES_DB:-tempra}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Il database non e' esposto all'esterno: ci parla solo l'API.
    expose:
      - '5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tempra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tempra}
      JWT_SECRET: ${JWT_SECRET:?serve un segreto per firmare i token}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      MAX_CONCURRENT_HASHES: ${MAX_CONCURRENT_HASHES:-2}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Lasciare vuoto per una installazione senza sincronizzazione.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      # Origine ammessa da connect-src nella Content-Security-Policy.
      # Deve coincidere con VITE_API_URL, senza barra finale.
      API_ORIGIN: ${VITE_API_URL:-}
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  db-data:
