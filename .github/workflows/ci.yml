name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualita:
    name: Tipi, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npm run typecheck

      - name: Test unitari
        run: npm run test

      - name: Build della PWA
        run: npm run build

      - name: Build dell API
        run: npm run build:api

      - name: Nessun trattino lungo nei sorgenti
        run: |
          # L'em-dash e' vietato in tutto il progetto: e' una regola di stile,
          # ma finisce nei testi mostrati all'utente, quindi la CI la verifica.
          if grep -rlP '\x{2014}' --include='*.ts' --include='*.tsx' --include='*.css' \
               --include='*.md' --include='*.json' apps packages docs 2>/dev/null; then
            echo "Trovato un em-dash nei file elencati sopra."
            exit 1
          fi
          echo "Nessun em-dash trovato."

  accessibilita:
    name: Accessibilita e percorsi utente
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa il browser
        run: npx playwright install --with-deps chromium

      - name: Build della PWA
        run: npm run build

      - name: Test end to end e verifica WCAG con axe
        run: npm run test:e2e --workspace=@tempra/web
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  container:
    name: Immagini Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build immagine web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build immagine API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
