# Stack di Tempra per Coolify.
#
# Differisce da docker-compose.yml (che resta il file per lo sviluppo locale)
# solo per il modo in cui i servizi si affacciano sulla rete:
#
#   - nessuna porta pubblicata sull'host: solo "expose", perche' il traffico
#     deve entrare esclusivamente dal proxy Traefik gestito da Coolify;
#   - nessuna rete custom: le crea Coolify;
#   - nessun "env_file": Coolify inietta da solo env_file ['.env'] in ogni
#     servizio;
#   - nessuna label Traefik scritta a mano: le genera Coolify a partire dai
#     domini configurati nell'interfaccia (campo docker_compose_domains via API),
#     e scriverle qui creerebbe router in conflitto.
#
# Domini da assegnare, DOPO il primo deploy:
#   web -> https://tempra.dominio.it
#   api -> https://api.tempra.dominio.it
#   db  -> nessuno
#
# Variabili da creare in Coolify prima del primo deploy:
#   POSTGRES_PASSWORD   openssl rand -hex 24   (solo esadecimale: finisce in DATABASE_URL)
#   JWT_SECRET          openssl rand -hex 48
#   ALLOWED_ORIGINS     https://tempra.dominio.it
#   VITE_API_URL        https://api.tempra.dominio.it   <- marcare "Build Variable"
#   REGISTRATION_OPEN   true al primo accesso, poi false
#
# Documentazione completa: docs/deploy/coolify.md

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tempra}
      # Le date sono sempre in UTC: la conversione al fuso locale e' compito del client.
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tempra} -d ${POSTGRES_DB:-tempra}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Nessun dominio e nessuna porta pubblicata: il database e' raggiungibile
    # solo dagli altri container dello stack.
    expose:
      - '5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tempra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tempra}
      JWT_SECRET: ${JWT_SECRET}
      # Origine della PWA, non dell'API. Senza barra finale.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Variabile di BUILD: entra nel bundle JavaScript, non nell'ambiente del
        # container. Cambiarla richiede un rebuild, il restart non ha effetto.
        # Vuota significa PWA senza sincronizzazione, ed e' una configurazione
        # valida e supportata.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - '8080'

volumes:
  db-data:
